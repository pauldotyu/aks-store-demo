{{- if eq .Values.agents.enabled true }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-agent-configs
data:
  INVENTORY_SERVICE_URL: "{{ .Values.inventoryAgent.inventoryServiceUrl }}"
  USE_WORKLOAD_IDENTITY_AUTH: "{{ .Values.inventoryAgent.useWorkloadIdentityAuth }}"
  AZURE_OPENAI_ENDPOINT: "{{ .Values.inventoryAgent.azureOpenAiEndpoint }}"
  AZURE_OPENAI_CHAT_MODEL: "{{ .Values.inventoryAgent.azureOpenAiChatModel }}"
  AZURE_OPENAI_API_VERSION: "{{ .Values.inventoryAgent.azureOpenAiApiVersion }}"
  OPENAI_BASE_URL: "{{ .Values.inventoryAgent.openAiBaseUrl }}"
  OPENAI_CHAT_MODEL: "{{ .Values.inventoryAgent.openAiChatModel }}"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-agent-secrets
data:
  OPENAI_API_KEY: "{{ .Values.inventoryAgent.openAiApiKey | b64enc }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: inventory-agent
  template:
    metadata:
      labels:
        app: inventory-agent
        {{- if eq .Values.useAzureAd true }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      {{- if eq .Values.useAzureAd true }}
      serviceAccount: {{ .Values.managedIdentityName }}
      {{- end }}
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: inventory-agent
        image: {{ .Values.inventoryAgent.image.repository }}:{{ .Values.inventoryAgent.image.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 7002
        envFrom:
        - configMapRef:
            name: inventory-agent-configs
        - secretRef:
            name: inventory-agent-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: 7002
          failureThreshold: 5
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7002
          failureThreshold: 3
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 7002
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-agent
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 7002
    targetPort: 7002
  selector:
    app: inventory-agent
{{- end }}
