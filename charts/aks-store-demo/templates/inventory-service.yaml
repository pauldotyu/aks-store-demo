{{- if eq .Values.agents.enabled true }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-configs
data:
  INVENTORY_SEED_PRODUCT_COUNT: "{{ .Values.inventoryService.seedProductCount }}"
  INVENTORY_SEED_AVAILABLE: "{{ .Values.inventoryService.seedAvailable }}"
  INVENTORY_SEED_REORDER_THRESHOLD: "{{ .Values.inventoryService.seedReorderThreshold }}"
  INVENTORY_SEED_REORDER_QUANTITY: "{{ .Values.inventoryService.seedReorderQuantity }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      containers:
      - name: inventory-service
        image: {{ .Values.inventoryService.image.repository }}:{{ .Values.inventoryService.image.tag | default .Chart.AppVersion }}
        ports:
        - containerPort: 7001
        envFrom:
        - configMapRef:
            name: inventory-service-configs
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health
            port: 7001
          failureThreshold: 5
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7001
          failureThreshold: 3
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 7001
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 7001
    targetPort: 7001
  selector:
    app: inventory-service
{{- end }}
