# Default values for aks-store-demo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: "dev"

useRabbitMQ: true # when true, local rabbitmq container will be used
useDocumentDB: true # when true, local documentdb container will be used

useAzureAd: false # when true, Azure AD auth will be used for ai-service, order-service, and makeline-service
managedIdentityName: "" # name of the Azure AD identity to use for the service account
managedIdentityClientId: "" # client ID of the managed identity to use for the service account

agents:
  enabled: false

aiService:
  # Specifies whether a ai-service deployment and service should be created
  create: false
  modelDeploymentName: ""
  openAiEndpoint: ""
  openAiKey: ""
  openAiOrgId: ""
  useAzureOpenAi: false
  openAiImageEndpoint: ""
  openAiImageModelName: ""
  azureOpenAiApiVersion: "2024-12-01-preview"
  azureOpenAiImageApiVersion: "2025-04-01-preview"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/ai-service"
    tag: "" # defaults to Chart.AppVersion

orderService:
  queueHost: "rabbitmq"
  queuePort: "5672"
  queueUsername: "username"
  queuePassword: "password"
  queueName: "orders"
  agentQueueName: "agent-orders"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/order-service"
    tag: "" # defaults to Chart.AppVersion

makelineService:
  orderQueueUri: "amqp://rabbitmq:5672"
  orderQueueUsername: "username"
  orderQueuePassword: "password"
  orderQueueName: "orders"
  orderQueueHost: ""
  orderDBApi: "mongodb"
  orderDBUri: "mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true"
  orderDBListConnectionStringsUrl: ""
  orderDBName: "orderdb"
  orderDBCollectionName: "orders"
  orderDBContainerName: "orders"
  orderDBUsername: "username"
  orderDBPassword: "password"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/makeline-service"
    tag: "" # defaults to Chart.AppVersion

productService:
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/product-service"
    tag: "" # defaults to Chart.AppVersion

inventoryService:
  seedProductCount: "10"
  seedAvailable: "100"
  seedReorderThreshold: "50"
  seedReorderQuantity: "25"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/inventory-service"
    tag: "" # defaults to Chart.AppVersion

inventoryAgent:
  inventoryServiceUrl: "http://inventory-service:7001"
  useWorkloadIdentityAuth: "false"
  azureOpenAiEndpoint: ""
  azureOpenAiChatModel: ""
  azureOpenAiApiVersion: "2024-12-01-preview"
  openAiBaseUrl: "http://ollama.default.svc.cluster.local:11434/v1"
  openAiChatModel: "gpt-oss:20b"
  openAiApiKey: "none"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/inventory-agent"
    tag: "" # defaults to Chart.AppVersion

orderAgent:
  queueUri: "amqp://rabbitmq:5672"
  queueHost: "rabbitmq"
  queuePort: "5672"
  queueUsername: "username"
  queuePassword: "password"
  queueName: "agent-orders"
  inventoryAgentA2aUrl: "http://inventory-agent:7002"
  modelProvider: "none" # none|local|foundry
  openAiBaseUrl: "http://ollama.default.svc.cluster.local:11434/v1"
  openAiChatModel: "gpt-oss:20b"
  openAiApiKey: "none"
  foundryOpenAiBaseUrl: ""
  foundryOpenAiChatModel: ""
  foundryOpenAiApiKey: ""
  azureOpenAiEndpoint: ""
  azureOpenAiChatModel: ""
  azureOpenAiApiVersion: "2024-12-01-preview"
  enableInstrumentation: "false"
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/order-agent"
    tag: "" # defaults to Chart.AppVersion

storeAdmin:
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/store-admin"
    tag: "" # defaults to Chart.AppVersion
  serviceType: LoadBalancer

storeFront:
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/store-front"
    tag: "" # defaults to Chart.AppVersion
  serviceType: LoadBalancer

virtualCustomer:
  create: true
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/virtual-customer"
    tag: "" # defaults to Chart.AppVersion
  ordersPerHour: 20

virtualWorker:
  create: true
  image:
    repository: "ghcr.io/azure-samples/aks-store-demo/virtual-worker"
    tag: "" # defaults to Chart.AppVersion
  ordersPerHour: 10

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}
