services:
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.112.0
    container_name: documentdb
    restart: always
    ports:
      - 10260:10260
    command: ["--username", "username", "--password", "password"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo | openssl s_client -connect localhost:10260 -brief 2>/dev/null | grep -q CONNECTED",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq
    restart: always
    environment:
      - "RABBITMQ_DEFAULT_USER=username"
      - "RABBITMQ_DEFAULT_PASS=password"
    ports:
      - 15672:15672
      - 5672:5672
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
  order-service:
    build: src/order-service
    container_name: order-service
    restart: always
    ports:
      - 3000:3000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://order-service:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - ORDER_QUEUE_HOSTNAME=rabbitmq
      - ORDER_QUEUE_PORT=5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=orders
      - AGENT_ORDER_QUEUE_NAME=${AGENT_ORDER_QUEUE_NAME:-}
    networks:
      - backend_services
    depends_on:
      rabbitmq:
        condition: service_healthy
  makeline-service:
    build: src/makeline-service
    container_name: makeline-service
    restart: always
    ports:
      - 3001:3001
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://makeline-service:3001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - ORDER_QUEUE_URI=amqp://rabbitmq:5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=orders
      - ORDER_DB_URI=mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true
      - ORDER_DB_NAME=orderdb
      - ORDER_DB_COLLECTION_NAME=orders
      - ORDER_DB_USERNAME=username
      - ORDER_DB_PASSWORD=password
    networks:
      - backend_services
    depends_on:
      rabbitmq:
        condition: service_healthy
      documentdb:
        condition: service_healthy
  inventory-service:
    build: src/inventory-service
    container_name: inventory-service
    restart: always
    profiles: ["agents"]
    ports:
      - 7001:7001
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7001/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - INVENTORY_SEED_PRODUCT_COUNT=10
      - INVENTORY_SEED_AVAILABLE=100
      - INVENTORY_SEED_REORDER_THRESHOLD=50
      - INVENTORY_SEED_REORDER_QUANTITY=25
    networks:
      - backend_services
  inventory-agent:
    build: src/inventory-agent
    container_name: inventory-agent
    restart: always
    profiles: ["agents"]
    ports:
      - 7002:7002
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7002/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - INVENTORY_SERVICE_URL=http://inventory-service:7001
      - USE_WORKLOAD_IDENTITY_AUTH=false
      - AZURE_OPENAI_ENDPOINT=
      - AZURE_OPENAI_CHAT_MODEL=
      - AZURE_OPENAI_API_VERSION=
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_CHAT_MODEL=gpt-oss:20b
      - OPENAI_API_KEY=none
      - ENABLE_INSTRUMENTATION=${ENABLE_INSTRUMENTATION:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=inventory-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend_services
    depends_on:
      inventory-service:
        condition: service_healthy
  order-agent:
    build: src/order-agent
    container_name: order-agent
    restart: always
    profiles: ["agents"]
    ports:
      - 7003:7003
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7003/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - ORDER_QUEUE_HOSTNAME=rabbitmq
      - ORDER_QUEUE_PORT=5672
      - ORDER_QUEUE_USERNAME=username
      - ORDER_QUEUE_PASSWORD=password
      - ORDER_QUEUE_NAME=agent-orders
      - INVENTORY_AGENT_A2A_URL=http://inventory-agent:7002
      - ORDER_AGENT_MODEL_PROVIDER=none
      - USE_WORKLOAD_IDENTITY_AUTH=false
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_CHAT_MODEL=gpt-oss:20b
      - OPENAI_API_KEY=none
      - FOUNDRY_OPENAI_BASE_URL=
      - FOUNDRY_OPENAI_CHAT_MODEL=
      - FOUNDRY_OPENAI_API_KEY=
      - AZURE_OPENAI_ENDPOINT=
      - AZURE_OPENAI_CHAT_MODEL=
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview
      - ENABLE_INSTRUMENTATION=${ENABLE_INSTRUMENTATION:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=order-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend_services
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventory-agent:
        condition: service_healthy
  product-service:
    build: src/product-service
    container_name: product-service
    restart: always
    ports:
      - 3002:3002
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://product-service:3002/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - AI_SERVICE_URL=http://ai-service:5001/
    networks:
      - backend_services
  store-front:
    build: src/store-front
    container_name: store-front
    restart: always
    ports:
      - 8080:8080
    healthcheck:
      test:
        ["CMD", "wget", "-O", "/dev/null", "-q", "http://store-front:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
    depends_on:
      - product-service
      - order-service
  store-admin:
    build: src/store-admin
    container_name: store-admin
    restart: always
    ports:
      - 8081:8081
    healthcheck:
      test:
        ["CMD", "wget", "-O", "/dev/null", "-q", "http://store-admin:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend_services
    depends_on:
      - product-service
      - makeline-service
  virtual-customer:
    build: src/virtual-customer
    container_name: virtual-customer
    restart: always
    environment:
      - ORDER_SERVICE_URL=http://order-service:3000/
      - ORDERS_PER_HOUR=30
    networks:
      - backend_services
    depends_on:
      order-service:
        condition: service_healthy
  virtual-worker:
    build: src/virtual-worker
    container_name: virtual-worker
    restart: always
    environment:
      - MAKELINE_SERVICE_URL=http://makeline-service:3001
      - ORDERS_PER_HOUR=20
    networks:
      - backend_services
    depends_on:
      makeline-service:
        condition: service_healthy
  ai-service:
    build: src/ai-service
    container_name: ai-service
    restart: always
    ports:
      - 5001:5001
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-O",
          "/dev/null",
          "-q",
          "http://ai-service:5001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      - USE_AZURE_OPENAI=True
      - AZURE_OPENAI_API_VERSION=2024-12-01-preview
      - AZURE_OPENAI_DEPLOYMENT_NAME= # required if using Azure OpenAI
      - AZURE_OPENAI_ENDPOINT= # required if using Azure OpenAI
      - AZURE_OPENAI_API_KEY= # required if using Azure OpenAI key auth (not needed with workload identity)
      - AZURE_OPENAI_IMAGE_API_VERSION=2025-04-01-preview
      - AZURE_OPENAI_IMAGE_DEPLOYMENT_NAME= # required for image generation
      - AZURE_OPENAI_IMAGE_ENDPOINT= # optional override; defaults to AZURE_OPENAI_ENDPOINT
    networks:
      - backend_services

  # ---------------------------------------------------------------------------
  # Telemetry profile: LGTM stack (Loki + Grafana + Tempo + Prometheus)
  # Run with: docker compose --profile telemetry up
  # Stop with: docker compose --profile telemetry down
  # Also set ENABLE_INSTRUMENTATION=true to activate OTel in the agents.
  # Note: LGTM ports (3000, 3100, 3200, 4317, 4318, 9090) conflict with the
  # per-agent compose stacks in src/inventory-agent/ and src/order-agent/.
  # Only one LGTM stack can run at a time.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    profiles: ["telemetry"]
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/lgtm/otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - OTEL_LOG_LEVEL=info
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - backend_services
  loki:
    image: grafana/loki:3.7.4
    profiles: ["telemetry"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./observability/lgtm/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend_services
  tempo:
    image: grafana/tempo:3.0.2
    profiles: ["telemetry"]
    restart: unless-stopped
    user: "root"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/lgtm/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4319:4317"
    networks:
      - backend_services
  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["telemetry"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./observability/lgtm/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend_services
  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["telemetry"]
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - "3000:3000"
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          orgId: 1
          url: http://tempo:3200
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
          jsonData:
            tracesToLogsV2:
              datasourceUid: 'loki'
              spanStartTimeShift: '-1h'
              spanEndTimeShift: '1h'
              filterByTraceID: true
              filterBySpanID: false
            tracesToMetrics:
              datasourceUid: 'prometheus'
            serviceMap:
              datasourceUid: 'prometheus'
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          orgId: 1
          url: http://prometheus:9090
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
          jsonData:
            exemplarTraceIdDestinations:
              - name: trace_id
                datasourceUid: tempo
        EOF
        /run.sh
    networks:
      - backend_services
    depends_on:
      - loki
      - tempo
      - prometheus

networks:
  backend_services:
    driver: bridge

volumes:
  tempo_data:
    driver: local
  prometheus_data:
    driver: local
